services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: delivery
      POSTGRES_DB: delivery_cruzeiro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U delivery -d delivery_cruzeiro']
      interval: 5s
      retries: 20
  migrate:
    image: ghcr.io/delivery-cruzeiro/backend-api:1.1.0
    build: .
    environment:
      DATABASE_URL: postgresql://delivery:${POSTGRES_PASSWORD}@postgres:5432/delivery_cruzeiro
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:?Set DEFAULT_ADMIN_EMAIL}
    command: ['node', 'scripts/migrate.mjs']
    depends_on:
      postgres: {condition: service_healthy}
  backend-api:
    image: ghcr.io/delivery-cruzeiro/backend-api:1.1.0
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://delivery:${POSTGRES_PASSWORD}@postgres:5432/delivery_cruzeiro
      HOST: 0.0.0.0
      PORT: 4000
      NODE_ENV: production
    ports: ['${PORT:-4000}:4000']
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  postgres_data:
