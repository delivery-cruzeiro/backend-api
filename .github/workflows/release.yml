name: Independent container release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish
        required: true
        type: string
  push:
    branches: [main, codex/render-upload-multioptions]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ inputs.release_tag || github.ref_name }}
      PUBLISH_IMAGE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/render-upload-multioptions')) }}
      PUBLISH_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Verify in Docker
        run: docker build --target verification .
      - name: Version and image identity
        id: release
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          if [[ "$PUBLISH_RELEASE" == true ]]; then test "$RELEASE_REF" = "v$VERSION"; git show-ref --verify "refs/tags/$RELEASE_REF"; fi
          if [[ "$PUBLISH_RELEASE" == true ]]; then IMAGE_TAG="$VERSION"; else IMAGE_TAG="sha-$(git rev-parse HEAD)"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Registry login
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.image_tag }}
            ${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Register published version in Infra
        if: env.PUBLISH_IMAGE == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TOKEN_CONFIGURED: ${{ secrets.INFRA_RELEASE_TOKEN != '' }}
        with:
          github-token: ${{ secrets.INFRA_RELEASE_TOKEN || github.token }}
          script: |
            if (process.env.RELEASE_TOKEN_CONFIGURED !== 'true') {
              core.warning('Configure INFRA_RELEASE_TOKEN (Contents write on Infra) to register published versions.');
              return;
            }
            const {execFileSync} = require('node:child_process');
            const ref = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
            const title = execFileSync('git', ['log', '-1', '--format=%s'], {encoding:'utf8'}).trim().slice(0, 300);
            await github.rest.repos.createDispatchEvent({
              owner: 'delivery-cruzeiro', repo: 'Infra', event_type: 'component_published',
              client_payload: {repository: context.repo.repo, ref, title, sequence: context.runNumber},
            });
      - name: Publish release notes
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_REF" --verify-tag --generate-notes
