name: Independent container release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish
        required: true
        type: string
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ inputs.release_tag || github.ref_name }}
      PUBLISH_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Verify in Docker
        run: docker build --target verification .
      - name: Version and image identity
        id: release
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          if [[ "$PUBLISH_RELEASE" == true ]]; then test "$RELEASE_REF" = "v$VERSION"; git show-ref --verify "refs/tags/$RELEASE_REF"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Registry login
        if: env.PUBLISH_RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH_RELEASE == 'true' }}
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish release notes
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_REF" --verify-tag --generate-notes
