# Single-server production is managed by the Infra repository.
# This file provides a standalone API against an externally managed PostgreSQL.
services:
  backend-api:
    image: ghcr.io/delivery-cruzeiro/backend-api:${API_VERSION:-1.2.0}
    build: .
    env_file: .env
    ports: ['127.0.0.1:${PORT:-4000}:4000']
    restart: unless-stopped
